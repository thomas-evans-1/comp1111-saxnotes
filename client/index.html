<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta lang="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaxNotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>



<body>

  <nav class="navbar">
    <div class="nav_content">
      <header class="site_header">
        <h1 class="site_title">SaxNotes</h1>
      </header>
      <input class="search_input" placeholder="Search Saxophone Pieces">
      <div class="filter_group">
        <label for="style_filter">Filter by style</label>
        <select id="styleFilter" class="form_select">
          <option value="">All</option>
          <option value="Jazz">Jazz</option>
          <option value="Classical">Classical</option>
          <option value="Funk">Funk</option>
        </select>
      </div>
    </div>
  </nav>


  <section id="piece_list">

    <div class="piece_info">
      <h3>Autumn Leaves</h3>
      <!-- this is where piece info went-->

    </div>




    <div class="comments_section">
      <h3>Comments</h3>
      <ul class="comments_list">
        <li>
          <p><strong>Emily</strong> (2026-02-16)</p>
          <p>Great piece! Focus on smooth legato in measure 12.</p>
        </li>
        <li>
          <p><strong>Michael</strong> (2026-02-14)</p>
          <p>The high notes in the bridge are tricky, practice slowly.</p>
        </li>
      </ul>

      <form class="add_comment_form">
        <label>Your Name</label>
        <input type="text">
        <label>Comment</label>
        <textarea rows="4"></textarea>
        <button type="submit">Add Comment</button>
      </form>
    </div>


    <div class="piece_list">
      <div class="piece_info">
        <h3>Autumn Leaves</h3>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
</body>

</html>
